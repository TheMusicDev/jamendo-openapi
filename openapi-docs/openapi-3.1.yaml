              - "130"
              - "150"
              - "200"
              - "300"
              - "400"
              - "500"
              - "600"
        - name: relation
          in: query
          required: false
          description: Select which user relations to include (like, favorite, review). If
            omitted, all are considered.
          schema:
            type: string
            enum:
              - like
              - favorite
              - review
      responses:
        "200":
          description: Successful response.
          content:
