openapi: 3.1.0
info:
  title: Jamendo API
  version: 3.0.0
  description: Community-generated OpenAPI description of the Jamendo API v3.0,
    built from jamendo-api-docs/.
servers:
  - url: https://api.jamendo.com/v3.0
security:
  - apikey_auth: []
paths:
  /albums/file:
    get:
      operationId: getAlbumFile
      summary: Redirect to the downloadable album file URL
      description: Returns an HTTP redirect to the requested album file. The request
        must include a valid client_id and an album id. The optional audioformat
        parameter selects the audio encoding (currently only mp3). Starting
        April 2022, a 404 error is returned if the album's 'zip_allowed' flag is
        false. This endpoint does not inherit the usual parent parameter
        declarations and returns no JSON body, only a redirect response.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/audioformat"
        - name: id
          in: query
          required: true
          description: Album identifier for which the file should be downloaded.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties: {}
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - The response is an HTTP 302 redirect to the actual file URL; no JSON
          payload is returned.
        - "'zip_allowed' flag is now included in other album endpoints; if
          false, this endpoint will return a 404."
        - Ensure your application follows redirects to obtain the file.
  /albums/musicinfo:
    get:
      operationId: getAlbumsMusicInfo
      summary: Retrieve album tags, descriptions and zip download availability
      description: Returns the list of tags for each album together with its HTML
        description and the new 'zip_allowed' boolean indicating whether the
        album can be offered for download. Starting April 2022, the 'zip' field
        will be an empty string when 'zip_allowed' is false. This endpoint
        behaves like the parent '/albums' method but adds the optional 'tag'
        filter (single tag only).
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id_2"
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/callback"
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Default 10, max 200. 'all'
            still limited to 200.
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: Sort results by given field(s). Append _asc or _desc to specify
            direction. Certain popularity fields default to desc.
          schema:
            type: string
            enum:
              - name
              - id
              - releasedate
              - artist_id
              - artist_name
              - popularity_total
              - popularity_month
              - popularity_week
        - name: fullcount
          in: query
          required: false
          description: If true, adds 'results_fullcount' header with total rows ignoring
            limit/offset. Use sparingly due to performance impact.
          schema:
            type: boolean
        - name: id
          in: query
          required: false
          description: One or more album IDs (comma‑separated).
          schema:
            type: integer
        - name: name
          in: query
          required: false
          description: Album name.
          schema:
            type: string
        - name: namesearch
          in: query
          required: false
          description: Search an album by name (partial match).
          schema:
            type: string
        - $ref: "#/components/parameters/artist_id"
        - $ref: "#/components/parameters/artist_name"
        - name: datebetween
          in: query
          required: false
          description: Released between dates; format 'yyyy-mm-dd_yyyy-mm-dd'.
          schema:
            type: string
        - $ref: "#/components/parameters/imagesize"
        - name: audioformat
          in: query
          required: false
          description: Audio format for fileurl; currently only mp32 (mp3 192kbps).
          schema:
            type: string
            enum:
              - mp32
        - name: type
          in: query
          required: false
          description: "Filter by release type: single or album."
          schema:
            type: string
            enum:
              - single
              - album
        - name: tag
          in: query
          required: false
          description: Filter albums by a single tag. Results are ordered by relevance
            unless another order is specified.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties: {}
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - The 'zip_allowed' boolean indicates if the album can be offered for
          download.
        - When 'zip_allowed' is false, the 'zip' field will be returned as an
          empty string (effective from April 2022).
        - Only a single tag can be supplied via the 'tag' parameter; multiple
          tags are not supported.
  /albums/tracks:
    get:
      operationId: getAlbumsTracks
      summary: Retrieve albums with their belonging tracks.
      description: Select and filter album entities along with their tracks. Includes
        the new 'zip_allowed' boolean indicating download permission and the
        'zip' field which may be empty when downloads are not allowed.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id_2"
        - $ref: "#/components/parameters/format"
        - name: callback
          in: query
          required: false
          description: JSONP callback function name (only for json format GET requests).
          schema:
            type: string
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return (default 10, max 200, 'all'
            limited to 200).
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: Sort results by field(s). Append _asc or _desc to specify
            direction; defaults to asc, rating fields default to desc.
          schema:
            type: string
            enum:
              - name
              - id
              - releasedate
              - artist_id
              - artist_name
              - popularity_total
              - popularity_month
              - popularity_week
              - track_id
              - track_name
              - track_position
        - name: fullcount
          in: query
          required: false
          description: If true, include total result count in header (performance impact).
          schema:
            type: boolean
        - name: id
          in: query
          required: false
          description: One or more album IDs.
          schema:
            type: integer
        - name: name
          in: query
          required: false
          description: An album name.
          schema:
            type: string
        - name: namesearch
          in: query
          required: false
          description: Search an album by name using wildcard (e.g., *searchquery*).
          schema:
            type: string
        - name: artist_id
          in: query
          required: false
          description: One or more artist IDs.
          schema:
            type: string
        - name: artist_name
          in: query
          required: false
          description: An artist name.
          schema:
            type: string
        - name: datebetween
          in: query
          required: false
          description: Released between dates (format yyyy-mm-dd_yyyy-mm-dd).
          schema:
            type: string
        - name: imagesize
          in: query
          required: false
          description: Cover size in pixels.
          schema:
            type: string
            enum:
              - "25"
              - "35"
              - "50"
              - "55"
              - "60"
              - "65"
              - "70"
              - "75"
              - "85"
              - "100"
              - "130"
              - "150"
              - "200"
              - "300"
              - "400"
              - "500"
              - "600"
        - name: audioformat
          in: query
          required: false
          description: Audio format for the 'audio' field; defaults to mp31.
          schema:
            type: string
            enum:
              - mp31
              - mp32
              - ogg
              - flac
        - name: type
          in: query
          required: false
          description: Filter by release type; defaults to both albums and singles.
          schema:
            type: string
            enum:
              - single
              - album
        - name: track_id
          in: query
          required: false
          description: One or more track IDs.
          schema:
            type: integer
        - name: track_name
          in: query
          required: false
          description: A track name.
          schema:
            type: string
        - name: audiodlformat
          in: query
          required: false
          description: Audio download format for 'audiodownload'; defaults to audioformat
            or mp32.
          schema:
            type: string
            enum:
              - mp31
              - mp32
              - ogg
              - flac
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties: {}
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - Since February 2021 the response includes a boolean field
          'zip_allowed' indicating if download is permitted.
        - From April 2022 the 'zip' field will be an empty string when
          'zip_allowed' is false.
  /albums:
    get:
      operationId: listAlbums
      summary: Retrieve a filtered list of album entities.
      description: Select and filter album entities, returning the main fields
        concerning albums. Includes the new 'zip_allowed' boolean indicating
        whether a download zip is permitted and notes that the 'zip' field will
        be empty when 'zip_allowed' is false. Supports pagination, ordering, and
        various search filters.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id_2"
        - $ref: "#/components/parameters/format"
        - name: callback
          in: query
          required: false
          description: Wrap JSON response in a callback function (JSONP). Only works with
            json format and GET requests.
          schema:
            type: string
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
        - name: order
          in: query
          required: false
          description: Sort results by the queried field(s). Append _asc or _desc to
            specify order (ascending is default, rating fields default to
            descending).
          schema:
            type: string
            enum:
              - name
              - id
              - releasedate
              - artist_id
              - artist_name
              - popularity_total
              - popularity_month
              - popularity_week
        - name: fullcount
          in: query
          required: false
          description: If true, the response header includes 'results_fullcount' (total
            rows without limit/offset). Use sparingly as it impacts performance.
          schema:
            type: boolean
        - name: id
          in: query
          required: false
          description: One or more album IDs (comma‑separated).
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Filter by exact album name.
          schema:
            type: string
        - name: namesearch
          in: query
          required: false
          description: Search album names using wildcard (*searchquery*).
          schema:
            type: string
        - $ref: "#/components/parameters/artist_id"
        - name: artist_name
          in: query
          required: false
          description: Filter by artist name.
          schema:
            type: string
        - name: datebetween
          in: query
          required: false
          description: Filter albums released between two dates (format
            yyyy-mm-dd_yyyy-mm-dd).
          schema:
            type: string
        - name: imagesize
          in: query
          required: false
          description: Desired cover image size in pixels.
          schema:
            type: integer
            enum:
              - 25
              - 35
              - 50
              - 55
              - 60
              - 65
              - 70
              - 75
              - 85
              - 100
              - 130
              - 150
              - 200
              - 300
              - 400
              - 500
              - 600
        - name: audioformat
          in: query
          required: false
          description: Audio format for file URLs; only 'mp32' (mp3 192kbps) is supported.
          schema:
            type: string
            enum:
              - mp32
        - name: type
          in: query
          required: false
          description: Select releases of a certain type. Defaults to both albums and
            singles.
          schema:
            type: string
            enum:
              - single
              - album
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties: {}
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - Since February 2021 the response includes a boolean field
          'zip_allowed' indicating if a download zip can be offered.
        - From April 2022, if 'zip_allowed' is false the 'zip' field will be an
          empty string.
        - The endpoint does not include the version prefix in the path; use
          '/albums' as shown.
  /artists:
    get:
      operationId: listArtists_artists
      summary: Retrieve a list of artists
      description: Returns artists with optional filtering, pagination and sorting.
        Sub‑methods such as artists/tracks, artists/albums, etc. are available.
        The method requires a client_id and supports various query parameters to
        control the result set.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id_2"
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/callback"
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Default 10, max 200. Using
            'all' still caps at 200.
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: Sort results by the specified field(s). Append _asc or _desc to set
            direction. Ascending is default, except popularity fields which
            default to descending.
          schema:
            type: string
            enum:
              - name
              - id
              - joindate
              - popularity_total
              - popularity_month
              - popularity_week
        - name: fullcount
          in: query
          required: false
          description: If true, response header includes 'results_fullcount' – the total
            number of rows without limit/offset. Use sparingly for performance.
          schema:
            type: boolean
        - name: id
          in: query
          required: false
          description: One or more artist IDs (comma‑separated).
          schema:
            type: integer
        - $ref: "#/components/parameters/name"
        - name: namesearch
          in: query
          required: false
          description: Search for artists whose name contains the given substring.
          schema:
            type: string
        - $ref: "#/components/parameters/hasimage"
        - name: datebetween
          in: query
          required: false
          description: "Filter on artist joining date. Format: 'yyyy-mm-dd_yyyy-mm-dd'
            (from_to)."
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties: {}
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - Do not include the version prefix in the path; use "/artists".
        - The 'limit' parameter cannot exceed 200 even when set to 'all'.
        - Popularity‑based order fields always use descending order, ignoring an
          explicit _asc suffix.
        - Enabling 'fullcount' may impact performance on heavy queries.
  /artists/locations:
    get:
      operationId: getArtistLocations
      summary: Retrieve artist geographical locations with optional filtering
      description: This method returns artists' declared geographical locations
        (country, city, coordinates) and supports filtering by country, city,
        latitude/longitude pair, radius, and various artist attributes.
        Geographical filtering can be expressed by country name/codes, city
        name, or a latitude/longitude coordinate pair combined with a km radius.
        Use the callback parameter only with JSON format; otherwise it is
        ignored.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id_2"
        - $ref: "#/components/parameters/format"
        - name: callback
          in: query
          required: false
          description: Wraps the JSON response in a callback function (JSONP). Only works
            for json format and GET requests; ignored otherwise.
          schema:
            type: string
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
        - name: order
          in: query
          required: false
          description: Sort results by the queried field(s). Append _asc or _desc to
            specify direction; _asc is default except for popularity fields
            which default to _desc.
          schema:
            type: string
            enum:
              - name
              - id
              - joindate
              - popularity_total
              - popularity_month
              - popularity_week
        - name: fullcount
          in: query
          required: false
          description: If true, adds 'results_fullcount' header with total rows ignoring
            limit/offset. Increases response time; use only when needed.
          schema:
            type: boolean
        - name: id
          in: query
          required: false
          description: One or more artist IDs to filter by.
          schema:
            type: integer
        - $ref: "#/components/parameters/name"
        - name: namesearch
          in: query
          required: false
          description: Search artists by name (wildcard *searchquery*).
          schema:
            type: string
        - $ref: "#/components/parameters/hasimage"
        - name: datebetween
          in: query
          required: false
          description: "Filter on artist joining date. Format: yyyy-mm-dd_yyyy-mm-dd
            (from_to)."
          schema:
            type: string
        - name: haslocation
          in: query
          required: false
          description: Return only artists with (true) or without (false) location data.
          schema:
            type: boolean
        - name: location_country
          in: query
