        - $ref: "#/components/parameters/callback"
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return (default 10, max 200). Using
            'all' still caps at 200.
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: Sort results by field(s). Append _asc or _desc to specify direction
            (default ascending).
          schema:
            type: string
        - name: fullcount
          in: query
          required: false
          description: If true, includes 'results_fullcount' in the header indicating
            total rows without pagination. Use sparingly for performance
            reasons.
          schema:
            type: boolean
        - $ref: "#/components/parameters/id_2"
        - name: access_token
          in: query
          required: false
          description: OAuth2 access token for the Jamendo user whose data you want to
            retrieve.
          schema:
            type: string
        - $ref: "#/components/parameters/name_2"
        - name: imagesize
          in: query
          required: false
