              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - If the specified artist does not exist, the request succeeds silently
          and no fan relationship is created.
        - "`fullcount` can impact performance and is not available on all heavy
          methods."
  /setuser/favorite:
