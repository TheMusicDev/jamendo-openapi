openapi: 3.1.0
info:
  title: Jamendo API
  version: 3.0.0
  description: Community-generated OpenAPI description of the Jamendo API v3.0,
    built from jamendo-api-docs/.
servers:
  - url: https://api.jamendo.com/v3.0
security:
  - apikey_auth: []
paths:
  /albums/file:
    get:
      operationId: getAlbumFile
      summary: Redirect to album file download
      description: Returns an HTTP redirect to the requested album file URL. The
        endpoint does not inherit parent parameter declarations. If the album's
        `zip_allowed` flag is false, the request will return a 404 error.
        Malformed requests result in a 500 error. The `client_id` parameter is
        required for authentication.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id"
        - name: audioformat
          in: query
          required: false
          description: The audio format for the file URL. Currently only `mp3` (192kbps)
            is supported.
          schema:
            type: string
            enum:
              - mp3
        - name: id
          in: query
          required: true
          description: Album identifier; only a single album ID is accepted.
          schema:
            type: integer
      responses:
        "302":
          description: Redirect to the requested file. No JSON body is returned.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - "`zip_allowed` field (returned by other album endpoints) determines
          whether a download is permitted; if false this endpoint returns 404."
        - The endpoint performs an HTTP 302 redirect to the actual file URL; no
          JSON body is returned.
        - Incorrect or missing parameters result in a 500 error with error
          details in the response headers.
  /albums/musicinfo:
    get:
      operationId: getAlbumsMusicInfo
      summary: Retrieve album information with tag filtering and music info
      description: Returns detailed album information, including tags, description
        (HTML) and a new boolean field 'zip_allowed' that indicates whether the
        album can be downloaded. If 'zip_allowed' is false, the 'zip' field will
        be returned as an empty string. Supports filtering by a single tag and
        all common album query parameters.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/format"
        - name: callback
          in: query
          required: false
          description: Wraps the JSON response in a callback function (JSONP). Only
            effective for JSON format and GET requests.
          schema:
            type: string
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Default is 10, max 200. The
            keyword 'all' is limited to 200 rows.
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: Sort results by the queried field(s). Add '_asc' or '_desc' suffix
            to specify direction. Default is ascending, except rating orders
            which default to descending.
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - id
                - releasedate
                - artist_id
                - artist_name
                - popularity_total
                - popularity_month
                - popularity_week
        - name: fullcount
          in: query
          required: false
          description: If true, includes 'results_fullcount' in the response header (total
            rows without pagination). Use only when necessary due to performance
            impact.
          schema:
            type: boolean
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/namesearch"
        - $ref: "#/components/parameters/artist_id"
        - $ref: "#/components/parameters/artist_name"
        - name: datebetween
          in: query
          required: false
          description: "Released between dates. Format: yyyy-mm-dd_yyyy-mm-dd (both
            inclusive)."
          schema:
            type: string
        - $ref: "#/components/parameters/imagesize"
        - name: audioformat
          in: query
          required: false
          description: Audio format for the fileurl field. Currently only 'mp32' (mp3
            192kbps).
          schema:
            type: string
            enum:
              - mp32
        - name: type
          in: query
          required: false
          description: Select releases of a certain type. Defaults to both 'album' and
            'single'.
          schema:
            type: array
            items:
              type: string
              enum:
                - single
                - album
        - name: tag
          in: query
          required: false
          description: Filter albums by a single tag. Results are ordered by relevance
            unless another order is specified.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        releasedate:
                          type: string
                        artist_id:
                          type: string
                        artist_name:
                          type: string
                        image:
                          type: string
                        zip:
                          type: string
                        zip_allowed:
                          type: boolean
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - The 'zip_allowed' field is new (Feb 2021); if false, 'zip' will be an
          empty string (April 2022 onward).
        - Only one tag can be supplied via the 'tag' parameter; multiple tags
          are not supported.
        - All parameters are passed as query string values; there is no request
          body for this GET endpoint.
  /albums/tracks:
    get:
      operationId: getAlbumTracks
      summary: Select and filter album entities and their belonging tracks
      description: This method selects and filters album entities together with their
        tracks. Since February 2021 a new boolean field `zip_allowed` is
        returned indicating whether the album can be offered for download. As of
        April 2022 the `zip` field will be an empty string when `zip_allowed` is
        false. All other fields are the same as in the parent `albums` method
        plus track‑specific fields.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/format"
        - name: callback
          in: query
          required: false
          description: Wrap the JSON response in a callback function (JSONP). Only works
            with format=json and GET requests.
          schema:
            type: string
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Default 10, max 200. The
            keyword 'all' still caps at 200.
          schema:
            type: string
            default: "10"
        - name: order
          in: query
          required: false
          description: Sort results by the queried field(s). Append _asc or _desc to
            specify direction. Ascending is default, except rating fields which
            default to descending.
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - id
                - releasedate
                - artist_id
                - artist_name
                - popularity_total
                - popularity_month
                - popularity_week
                - track_id
                - track_name
                - track_position
        - name: fullcount
          in: query
          required: false
          description: If true, include `results_fullcount` (total rows without
            limit/offset) in the response header. Use with caution as it impacts
            performance.
          schema:
            type: boolean
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/name"
        - $ref: "#/components/parameters/namesearch"
        - $ref: "#/components/parameters/artist_id"
        - $ref: "#/components/parameters/artist_name"
        - name: datebetween
          in: query
          required: false
          description: "Released between dates. Format: yyyy-mm-dd_yyyy-mm-dd (from_to)."
          schema:
            type: string
        - $ref: "#/components/parameters/imagesize"
        - name: audioformat
          in: query
          required: false
          description: Audio format for the `audio` field. Defaults to mp31.
          schema:
            type: string
            enum:
              - mp31
              - mp32
              - ogg
              - flac
            default: mp31
        - name: type
          in: query
          required: false
          description: Select releases of a certain type. By default both albums and
            singles are returned.
          schema:
            type: array
            items:
              type: string
              enum:
                - single
                - album
        - $ref: "#/components/parameters/track_id"
        - $ref: "#/components/parameters/track_name"
        - name: audiodlformat
          in: query
          required: false
          description: Audio download format for the `audiodownload` field. Falls back to
            `audioformat` or mp32.
          schema:
            type: string
            enum:
              - mp31
              - mp32
              - ogg
              - flac
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        releasedate:
                          type: string
                        artist_id:
                          type: string
                        artist_name:
                          type: string
                        track_id:
                          type: string
                        image:
                          type: string
                        zip_allowed:
                          type: boolean
                        zip:
                          type:
                            - string
                            - "null"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - The `zip_allowed` field is new (Feb 2021). If false, the `zip` field
          will be empty (Apr 2022).
        - "`limit` caps at 200 even when the keyword 'all' is used."
        - "`order` defaults to ascending, except rating fields which always sort
          descending."
        - "`fullcount` can impact performance; enable only when needed."
  /albums:
    get:
      operationId: listAlbums
      summary: Retrieve a list of albums
      description: Selects and filters album entities, returning the main fields for
        each album. Includes the new 'zip_allowed' boolean indicating whether
        the album zip download is permitted; if false, the 'zip' field will be
        an empty string. Supports various query parameters for pagination,
        ordering, and filtering by album or artist attributes.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/format"
        - name: callback
          in: query
          required: false
          description: Wraps the JSON response in a callback function (JSONP). Only works
            with format=json and GET requests.
          schema:
            type: string
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Default is 10, max is 200.
            'all' returns up to 200 rows.
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: Sort results by the queried field(s). Append _asc or _desc to
            specify direction (default asc). Popularity fields default to desc.
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - id
                - releasedate
                - artist_id
                - artist_name
                - popularity_total
                - popularity_month
                - popularity_week
        - name: fullcount
          in: query
          required: false
          description: If true, the response header includes 'results_fullcount' – the
            total number of rows without limit/offset. Use sparingly for
            performance.
          schema:
            type: boolean
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/name"
        - name: namesearch
          in: query
          required: false
          description: Search an album by name (wildcard match).
          schema:
            type: string
        - $ref: "#/components/parameters/artist_id"
        - $ref: "#/components/parameters/artist_name"
        - name: datebetween
          in: query
          required: false
          description: Released between dates, format 'yyyy-mm-dd_yyyy-mm-dd'.
          schema:
            type: string
        - $ref: "#/components/parameters/imagesize"
        - name: audioformat
          in: query
          required: false
          description: Audio format for file URLs; currently only mp32 (mp3 192kbps).
          schema:
            type: string
            enum:
              - mp32
        - name: type
          in: query
          required: false
          description: Select only releases of a certain type. Defaults to both 'album'
            and 'single'.
          schema:
            type: array
            items:
              type: string
              enum:
                - single
                - album
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        releasedate:
                          type: string
                        artist_id:
                          type: string
                        artist_name:
                          type: string
                        image:
                          type: string
                        zip:
                          type: string
                        zip_allowed:
                          type: boolean
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - If 'zip_allowed' is false, the 'zip' field will be an empty string (as
          of April 2022).
        - The 'fullcount' parameter adds a heavyweight header; use only when
          necessary.
        - The 'limit' parameter caps at 200 rows even when set to 'all'.
        - Ordering by popularity fields always forces descending order
          regardless of _asc suffix.
  /artists/albums:
    get:
      operationId: getArtistsAlbums
      summary: Retrieve artists and their albums
      description: Returns a list of artists together with their albums. Supports
        filtering, ordering and pagination. The required `client_id` API key
        must be provided. The `format` parameter controls the response format
        (xml, json, jsonpretty). The `order` parameter accepts multiple fields
        and supports `_asc`/`_desc` suffixes. Setting `fullcount=true` adds a
        total‑count header but may impact performance. Limits are capped at 200
        rows; the special keyword `all` is still limited to 200.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/format"
        - name: callback
          in: query
          required: false
          description: Wraps the JSON response in a JavaScript callback (JSONP). Only
            works with `format=json` and GET requests.
          schema:
            type: string
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Default 10, maximum 200. The
            keyword 'all' is also capped at 200.
          schema:
            type: string
            default: "10"
        - name: order
          in: query
          required: false
          description: Sort results by the queried field(s). Append `_asc` or `_desc` to
            each field; ascending is default, but popularity fields default to
            descending.
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - id
                - joindate
                - popularity_total
                - popularity_month
                - popularity_week
                - album_name
                - album_id
                - album_releasedate
        - name: fullcount
          in: query
          required: false
          description: If true, adds `results_fullcount` to the response header (perf
            impact).
          schema:
            type: boolean
        - $ref: "#/components/parameters/id_2"
        - name: name
          in: query
          required: false
          description: An exact artist name.
          schema:
            type: string
        - name: namesearch
          in: query
          required: false
          description: Search an artist by name (wildcard pattern).
          schema:
            type: string
        - $ref: "#/components/parameters/hasimage"
        - name: datebetween
          in: query
          required: false
          description: "Filter on the artist joining date. Format: `YYYY-MM-DD_YYYY-MM-DD`."
          schema:
            type: string
        - $ref: "#/components/parameters/album_id"
        - $ref: "#/components/parameters/album_name"
        - name: album_datebetween
          in: query
          required: false
          description: "Filter on album release date. Format: `YYYY-MM-DD_YYYY-MM-DD`."
          schema:
            type: string
        - name: imagesize
          in: query
          required: false
          description: Desired album cover size in pixels.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        headers:
                          type: object
                        results:
                          type: array
                          items:
                            type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - "`client_id` is mandatory for every request."
        - "`format` defaults to json if omitted."
        - "`order` fields that are popularity metrics ignore an explicit `_asc`
          suffix and always sort descending."
        - The `limit` parameter cannot exceed 200; using `all` still returns a
          maximum of 200 rows.
        - "`fullcount=true` adds a heavy header and should be used only when
          necessary."
  /artists/locations:
    get:
      operationId: getArtistsLocations
      summary: Retrieve artists' geographical locations with optional filtering
      description: Returns a list of artists together with their declared geographical
        location information. Allows filtering by country, city, coordinates and
        radius, as well as typical Jamendo query parameters such as pagination,
        ordering and format. The client_id parameter is required for
        authentication.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/format_2"
        - name: callback
          in: query
          required: false
          description: Wraps JSON response in a callback function (JSONP). Only works with
            format=json and GET requests.
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: The position to start returning results from.
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return (max 200). The special keyword
            'all' also caps at 200.
          schema:
            type: string
            default: "10"
        - name: order
          in: query
          required: false
          description: Sort results by the queried field(s). Append _asc or _desc to
            specify direction; default is ascending except for popularity fields
            which default to descending.
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - id
                - joindate
                - popularity_total
                - popularity_month
                - popularity_week
        - name: fullcount
          in: query
          required: false
          description: If true, the response header includes the total count of results
            without pagination.
          schema:
            type: boolean
            default: false
        - name: id
          in: query
          required: false
          description: One or more artist IDs to filter.
          schema:
            type: array
            items:
              type: integer
        - name: name
          in: query
          required: false
          description: Exact name of the artist.
          schema:
            type: string
        - $ref: "#/components/parameters/namesearch_2"
        - $ref: "#/components/parameters/hasimage_2"
        - name: datebetween
          in: query
          required: false
          description: Filter on the artist joining date (format yyyy-mm-dd_yyyy-mm-dd).
          schema:
            type: string
        - name: haslocation
          in: query
          required: false
          description: Return only artists with (true) or without (false) locations.
          schema:
            type: boolean
        - name: location_country
          in: query
          required: false
          description: Filter by artist country using ISO 3166-1 alpha-3 codes.
          schema:
            type: array
            items:
              type: string
        - name: location_city
          in: query
          required: false
          description: Filter by artist city.
          schema:
            type: string
        - name: location_coords
          in: query
          required: false
          description: Coordinates expressed as latitude_longitude (e.g., 45.46427_9.18951).
          schema:
            type: string
        - name: location_radius
          in: query
          required: false
          description: Radius in kilometers around location_coords. Ignored if
            location_coords is not provided.
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        headers:
                          type: object
                        results:
                          type: array
                          items:
                            type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_uri:
                    type: string
      x-notes:
        - client_id is mandatory; without it the request will be rejected.
        - When using the callback parameter, format must be set to json;
          otherwise the parameter is ignored.
        - location_radius is only applied when location_coords is supplied;
          otherwise it is ignored.
        - The limit parameter caps at 200 even when using the 'all' keyword.
  /artists/musicinfo:
    get:
      operationId: getArtistsMusicInfo
      summary: Returns tags list and description for each artist.
      description: Returns the tags list of each artist together with its HTML
        description (if present). All common parameters of the parent 'artists'
        endpoint are supported, plus a 'tag' filter (single tag only) and
        additional pagination and ordering options. Use the 'format' parameter
        to choose the response format. The 'fullcount' flag can be enabled for
        pagination but may impact performance.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/format"
        - name: callback
          in: query
          required: false
          description: Wraps the JSON response in a callback function (JSONP). Only works
            with JSON format on GET requests.
          schema:
            type: string
        - $ref: "#/components/parameters/offset"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Default 10, max 200. The
            keyword 'all' is treated as 200.
          schema:
            type: string
            default: "10"
        - name: order
          in: query
          required: false
          description: Sort results by the queried field(s). Append _asc or _desc to
            specify direction; _asc is default except for popularity fields
            which default to _desc.
          schema:
            type: array
            items:
              type: string
              enum:
                - name
                - id
                - joindate
                - popularity_total
                - popularity_month
                - popularity_week
        - name: fullcount
          in: query
          required: false
          description: If true, the response header includes 'results_fullcount' – the
            total number of rows without pagination. Use sparingly as it may
            affect performance.
          schema:
            type: boolean
        - $ref: "#/components/parameters/id_2"
        - name: name
          in: query
          required: false
          description: Exact artist name to match.
          schema:
            type: string
        - name: namesearch
          in: query
          required: false
          description: Search an artist by name using wildcard matching.
          schema:
            type: string
        - $ref: "#/components/parameters/hasimage"
        - name: datebetween
          in: query
          required: false
          description: "Filter on artist joining date. Format: yyyy-mm-dd_yyyy-mm-dd
            (from_to). Both dates mandatory."
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Filter artists by a single tag. Results are returned by relevance
            unless a different order is specified.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
