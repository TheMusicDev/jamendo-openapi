              schema:
                type: object
                properties:
                  headers:
                    type: object
                    properties:
                      status:
                        type: string
                      code:
                        type: string
                      error_message:
                        type: string
                      warnings:
                        type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties: {}
        default:
