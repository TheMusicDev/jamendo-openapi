          the user.
        - authType is apikey because the endpoint can be accessed with a
          client_id; OAuth2 token is optional and used only when access_token is
          provided.
        - The 'order' parameter expects a comma‑separated list of fields, each
          optionally suffixed with _asc or _desc.
  /setuser/dislike:
