  /setuser/fan:
    post:
      operationId: setUserFan
      summary: Make a user become a fan of an artist
      description: Allows the user identified by `user_id` (derived from the access
        token) to become a fan of the artist identified by `artist_id`. If the
        artist does not exist, no error is raised but the fan relationship will
        not appear in read requests. Requires a valid client_id and OAuth2
        access token with the `music` scope.
      security:
        - oauth2: *a1
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/format_3"
        - name: fullcount
          in: query
