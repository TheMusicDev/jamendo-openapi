  /users:
    get:
      operationId: getUser
      summary: Get main information about a user
      description: Retrieves the primary information for a Jamendo user. This endpoint
        is a lookup (not a search) and requires a client_id together with at
        least one of id, access_token, or name to identify the user.
      security:
        - apikey_auth: []
      parameters:
        - $ref: "#/components/parameters/client_id_2"
