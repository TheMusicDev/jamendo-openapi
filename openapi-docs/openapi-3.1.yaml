components:
  parameters:
    client_id:
      name: client_id
      in: query
      required: true
      description: A Client Id provided by devportal.jamendo.com
      schema:
        type: string
    audioformat:
      name: audioformat
      in: query
      required: false
      description: The audio format for the file URL. Currently only 'mp3' (192kbps)
        is supported.
      schema:
        type: string
        enum:
          - mp3
    client_id_2:
      name: client_id
      in: query
      required: true
      description: A Client Id provided by devportal.jamendo.com.
      schema:
        type: string
    format:
      name: format
      in: query
      required: false
      description: The results formatting type.
      schema:
        type: string
        enum:
          - xml
          - json
          - jsonpretty
    callback:
      name: callback
      in: query
      required: false
      description: Wraps the JSON response in a callback function (JSONP). Only works
        with json format and GET requests.
      schema:
        type: string
    offset:
      name: offset
      in: query
      required: false
      description: The position to start returning results from.
      schema:
        type: integer
    artist_id:
      name: artist_id
      in: query
      required: false
      description: One or more artist IDs (comma‑separated).
      schema:
        type: string
    artist_name:
      name: artist_name
      in: query
      required: false
      description: Artist name.
      schema:
        type: string
    imagesize:
      name: imagesize
      in: query
      required: false
      description: Cover image size in pixels.
      schema:
        type: string
        enum:
          - "25"
          - "35"
          - "50"
          - "55"
          - "60"
          - "65"
          - "70"
          - "75"
          - "85"
          - "100"
          - "130"
          - "150"
          - "200"
          - "300"
          - "400"
          - "500"
          - "600"
    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of results to return. Default is 10, max 200. Using
        'all' still caps at 200.
      schema:
        type: string
        default: "10"
    hasimage:
      name: hasimage
      in: query
      required: false
      description: Return only artists that have an image.
      schema:
        type: string
        enum:
          - "true"
          - "1"
    name:
      name: name
      in: query
      required: false
      description: Exact artist name.
      schema:
        type: string
    callback_2:
      name: callback
      in: query
      required: false
      description: Wrap the JSON response in a callback function (JSONP). Only works
        with json format and GET requests.
      schema:
        type: string
    format_2:
      name: format
      in: query
      required: false
      description: The results formatting type.
      schema:
        type: string
        enum:
          - xml
          - json
          - jsonpretty
    id:
      name: id
      in: query
      required: false
      description: One or more playlist IDs.
      schema:
        type: array
        items:
          type: string
    user_id:
      name: user_id
      in: query
      required: false
      description: One or more author IDs (no access token required).
      schema:
        type: array
        items:
          type: string
    user_name:
      name: user_name
      in: query
      required: false
      description: One or more user names.
      schema:
        type: string
    access_token:
      name: access_token
      in: query
      required: false
      description: OAuth2 access token for the Jamendo user.
      schema:
        type: string
    hasscore:
      name: hasscore
      in: query
      required: false
      description: Filter reviews that have (or do not have) a score.
      schema:
        type: boolean
    album_id:
      name: album_id
      in: query
      required: false
      description: One or more album IDs.
      schema:
        type: integer
    artist_id_2:
      name: artist_id
      in: query
      required: false
      description: One or more artist IDs.
      schema:
        type: integer
    id_2:
      name: id
      in: query
      required: false
      description: One or more user IDs (no access token required).
      schema:
        type: integer
    name_2:
      name: name
      in: query
      required: false
      description: One or more user names.
      schema:
        type: string
    format_3:
      name: format
      in: query
      required: false
      description: The results formatting type
      schema:
        type: string
