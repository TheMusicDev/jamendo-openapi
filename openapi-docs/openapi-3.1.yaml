          schema:
            type: boolean
        - name: access_token
          in: query
          required: true
          description: A valid OAuth2 access token (music scope) for the Jamendo user to
            be updated
          schema:
            type: string
        - name: artist_id
          in: query
          required: true
          description: Identifier of the artist to become a fan of
          schema:
            type: integer
      responses:
