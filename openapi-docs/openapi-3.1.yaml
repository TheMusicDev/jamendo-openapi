          schema:
            type: boolean
        - name: access_token
          in: query
          required: true
          description: A valid access token (with 'music' scope) for the Jamendo user to
            update. Obtain via the OAuth2 process.
          schema:
            type: string
        - name: track_id
          in: query
          required: true
          description: Identifier of the track to dislike.
